server:
  port: 8222

spring:
  cloud:
    gateway:
      server:
        webmvc:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/addresses/**
            - id: stores-service
              uri: lb://stores-service
              predicates:
                - Path=/api/v1/stores/**,/api/v1/categories/**,/api/v1/menu-items/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:3000
                  - http://localhost:3001
                  - http://localhost:3002
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
