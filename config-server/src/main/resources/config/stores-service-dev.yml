spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/food_delivery_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public
