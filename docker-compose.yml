name: food-delivery

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: dev
  CONFIG_SERVER_URL: http://config-server:8071
  EUREKA_URL: http://discovery-service:8761/eureka
  DB_URL: jdbc:postgresql://postgres:5432/food_delivery_db
  DB_USERNAME: postgres
  DB_PASSWORD: postgres

x-service-depends: &service-depends
  postgres:
    condition: service_healthy
  config-server:
    condition: service_healthy
  discovery-service:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: fd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - food-delivery-net

  discovery-service:
    build:
      context: ./discovery-service
    image: fd/discovery-service:latest
    container_name: fd-discovery-service
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - food-delivery-net

  config-server:
    build:
      context: ./config-server
    image: fd/config-server:latest
    container_name: fd-config-server
    restart: unless-stopped
    ports:
      - "8071:8071"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8071/auth-service/default || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - food-delivery-net

  api-gateway:
    build:
      context: ./api-gateway
    image: fd/api-gateway:latest
    container_name: fd-api-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://config-server:8071
      EUREKA_URL: http://discovery-service:8761/eureka
    ports:
      - "8222:8222"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8222/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - food-delivery-net

  auth-service:
    build:
      context: ./auth-service
    image: fd/auth-service:latest
    container_name: fd-auth-service
    restart: unless-stopped
    environment:
      <<: *service-env
    ports:
      - "8081:8081"
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - food-delivery-net

  stores-service:
    build:
      context: ./stores-service
    image: fd/stores-service:latest
    container_name: fd-stores-service
    restart: unless-stopped
    environment:
      <<: *service-env
    ports:
      - "8082:8082"
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - food-delivery-net

  order-service:
    build:
      context: ./order-service
    image: fd/order-service:latest
    container_name: fd-order-service
    restart: unless-stopped
    environment:
      <<: *service-env
    ports:
      - "8083:8083"
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - food-delivery-net

  prometheus:
    image: prom/prometheus:latest
    container_name: fd-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api-gateway
    networks:
      - food-delivery-net

  grafana:
    image: grafana/grafana:latest
    container_name: fd-grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - food-delivery-net

volumes:
  postgres-data:
  grafana-data:

networks:
  food-delivery-net:
    driver: bridge
